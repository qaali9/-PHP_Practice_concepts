<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Registration System</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f2f4f8; }
        .box { width: 480px; margin: 30px auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
        h2 { text-align: center; color: #1f3a5f; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input[type=text], input[type=number], select, input[type=file] { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
        .radio { font-weight: normal; display: inline; margin-right: 15px; }
        .buttons { margin-top: 20px; text-align: center; }
        button { padding: 10px 22px; border: none; border-radius: 4px; cursor: pointer; color: #fff; }
        .submit { background: #1f7a3f; }
        .reset { background: #b03a2e; }
    </style>
</head>
<body>
<div class="box">
    <h2>Employee Registration</h2>

    <form action="process.php" method="post" enctype="multipart/form-data">

        <label for="full_name">Employee Full Name</label>
        <input type="text" id="full_name" name="full_name">

        <label for="emp_id">Employee ID</label>
        <input type="text" id="emp_id" name="emp_id">

        <label>Gender</label>
        <input type="radio" id="male" name="gender" value="Male"> <label class="radio" for="male">Male</label>
        <input type="radio" id="female" name="gender" value="Female"> <label class="radio" for="female">Female</label>

        <label for="department">Department</label>
        <select id="department" name="department">
            <option value="">-- Select Department --</option>
            <option value="Human Resources">Human Resources</option>
            <option value="Finance">Finance</option>
            <option value="Information Technology">Information Technology</option>
            <option value="Administration">Administration</option>
        </select>

        <label for="basic_salary">Basic Salary</label>
        <input type="number" id="basic_salary" name="basic_salary" step="0.01">

        <label for="allowance">Allowance</label>
        <input type="number" id="allowance" name="allowance" step="0.01">

        <label for="deduction">Deduction</label>
        <input type="number" id="deduction" name="deduction" step="0.01">

        <label for="document">Employee Document</label>
        <input type="file" id="document" name="document">

        <div class="buttons">
            <button type="submit" class="submit">Register and Calculate</button>
            <button type="reset" class="reset">Reset</button>
        </div>
    </form>
</div>
</body>
</html>
