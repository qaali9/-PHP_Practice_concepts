<!DOCTYPE html>
<html>
<head>
    <title>Student Grade Management System</title>
</head>
<body>

    <h2>Student Grade Management System</h2>

    <form action="process.php" method="POST"
          enctype="multipart/form-data">

        Student Full Name:
        <input type="text" name="student_name">
        <br><br>

        Student ID:
        <input type="text" name="student_id">
        <br><br>

        Gender:
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female"> Female
        <br><br>

        Faculty:
       <select name="faculty">
        <option value="">select faculty</option>
        <option value="Computer Science">IT</option>
        <option value="Engineering">Engneer</option>
        <option value="Medicine">Medicine</option>
        <option value="Business">Business</option>
    </select>
        <br><br>

        PHP Mark:<input type="number" name="php_mark" min="0" max="100">
        <br><br>

        Database Mark:
        <input type="number" name="database_mark" min="0" max="100" >
        <br><br>

        Networking Mark:
        <input type="number" name="networking_mark" min="0" max="100" >
        <br><br>

        Student Certificate:
        <input type="file" name="certificate">
        <br><br>

        <button type="submit">Submit and Calculate</button>
        <button type="reset">Reset</button>

    </form>

</body>
</html>
